{% load i18n %}
<div class="card mb-3" style="border-style:dashed;opacity:.6">
  <div class="card-body py-2 px-3 d-flex align-items-center gap-3" style="font-size:12px">
    <span style="color:var(--bs-secondary-color)">⚑ Fleet Readiness widget is available</span>
    <form method="post" action="{% url 'aa_fleet_hub:fleet_widget_toggle' %}" style="display:inline">
      {% csrf_token %}
      <input type="hidden" name="next" value="/dashboard/">
      <button type="submit" class="fh-btn fh-btn-secondary" style="font-size:11px;padding:2px 10px">Enable</button>
    </form>
  </div>
</div>
