[tox]
envlist = py{311,312,313}-django52
skipsdist = False

[testenv]
deps =
    django52: Django>=5.2,<6.0
    pytest
    pytest-django
    # Minimal stubs so imports resolve without a full AA install
    requests
commands =
    pytest {posargs}

[testenv:lint]
deps =
    pre-commit
commands =
    pre-commit run --all-files

[pytest]
python_files = tests/test_*.py
